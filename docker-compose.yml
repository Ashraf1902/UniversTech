name: univers-tech

services:
  db:
    image: mysql:8.0
    container_name: univers_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-univars_tech}
      MYSQL_USER: ${DB_USERNAME:-univars}
      MYSQL_PASSWORD: ${DB_PASSWORD:-univars_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./univers-tech.pro/univers-tech.pro
    container_name: univers_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-univars_tech}
      DB_USERNAME: ${DB_USERNAME:-univars}
      DB_PASSWORD: ${DB_PASSWORD:-univars_secret}
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  backend-web:
    image: nginx:alpine
    container_name: univers_backend_web
    restart: unless-stopped
    volumes:
      - ./univers-tech.pro/univers-tech.pro/public:/var/www/html/public:ro
      - backend_uploads:/var/www/html/public/uploads
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./front-end
    container_name: univers_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend-web

volumes:
  db_data:
  backend_storage:
  backend_uploads: